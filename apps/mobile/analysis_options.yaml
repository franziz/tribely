include: package:flutter_lints/flutter.yaml

analyzer:
  # Strict static analysis — Dart's stricter type-checking modes per
  # https://dart.dev/tools/analysis#enabling-additional-type-checks
  language:
    strict-casts: true # No implicit downcasts
    strict-inference: true # No implicit dynamic
    strict-raw-types: true # No raw generic types

  errors:
    # Riverpod codegen produces invalid_annotation_target warnings on @riverpod;
    # ignore the false positive.
    invalid_annotation_target: ignore
    # Don't fail CI on TODOs — common during MVP.
    todo: ignore
    # Promote dead code from info → warning so it surfaces clearly.
    dead_code: warning

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

# Top-level `plugins:` (Dart 3.5+ analysis_server_plugin mechanism).
# This is NOT `analyzer.plugins:` — that one runs through custom_lint as a
# host. The top-level form lets the analyzer download and run the plugin
# directly, bypassing custom_lint entirely. Per riverpod.dev:
# https://riverpod.dev/docs/introduction/getting_started
plugins:
  riverpod_lint: ^3.1.3

linter:
  rules:
    # ── Error prevention (catches real bugs) ──────────────────────────────
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_returning_null_for_future
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures # Future not awaited — common async bug

    # ── Style / readability ──────────────────────────────────────────────
    - prefer_single_quotes
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - prefer_typing_uninitialized_variables
    - sort_constructors_first
    - sort_pub_dependencies
    - use_super_parameters

    # ── Footguns ─────────────────────────────────────────────────────────
    - avoid_print # Use logger instead
    - require_trailing_commas # Better diffs
