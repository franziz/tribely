include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

# Top-level `plugins:` (Dart 3.5+ analysis_server_plugin mechanism).
# This is NOT `analyzer.plugins:` — that one runs through custom_lint as a
# host. The top-level form lets the analyzer download and run the plugin
# directly, bypassing custom_lint entirely. Per riverpod.dev:
# https://riverpod.dev/docs/introduction/getting_started
plugins:
  riverpod_lint: ^3.1.3

linter:
  rules:
    - prefer_single_quotes
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - avoid_print
    - require_trailing_commas
    - sort_pub_dependencies
    - use_super_parameters
