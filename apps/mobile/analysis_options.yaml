include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
  # NOTE: custom_lint plugin removed — its synthesized client referenced
  # riverpod_lint-3.1.3 while pub installed 3.0.3 (version mismatch in
  # custom_lint's project synthesizer). The plugin failed to start in
  # both `flutter analyze` and `dart analyze`, on both local and CI.
  # Re-enable when invertase/dart_custom_lint sorts out the version
  # resolution mismatch upstream.

linter:
  rules:
    - prefer_single_quotes
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - avoid_print
    - require_trailing_commas
    - sort_pub_dependencies
    - use_super_parameters
