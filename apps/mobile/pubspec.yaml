name: tribely
description: Tribely mobile app.
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ^3.11.0
  flutter: 3.41.9

dependencies:
  dio: ^5.9.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_map: ^8.3.0
  flutter_map_marker_cluster: ^8.2.2
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.3.1
  fpdart: ^1.2.0
  freezed_annotation: ^3.0.0
  geolocator: ^14.0.2
  get_it: ^9.2.1
  go_router: ^17.3.0
  intl: ^0.20.2
  json_annotation: ^4.11.0
  latlong2: ^0.9.1
  logger: ^2.7.0
  package_info_plus: ^10.1.0
  pretty_dio_logger: ^1.4.0
  riverpod_annotation: ^4.0.2
  sentry_flutter: ^9.21.0
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  build_runner: ^2.4.13
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  # 6.13.1+ requires analyzer ^10 which conflicts with riverpod_generator
  # 4.0.3's analyzer ^9. 6.13.0 is the latest within the analyzer-9 band.
  json_serializable: ^6.13.0
  mocktail: ^1.0.5
  # Required for url_launcher platform mocking in widget tests.
  # Both are transitive deps of url_launcher; listed explicitly to satisfy
  # the depend_on_referenced_packages lint in test files.
  plugin_platform_interface: ^2.1.8
  riverpod_generator: ^4.0.3
  url_launcher_platform_interface: ^2.3.2
  # NOTE: `custom_lint`, `custom_lint_builder`, `riverpod_lint` are NOT
  # in dev_dependencies. Per riverpod.dev docs, riverpod_lint is loaded
  # via the new `analysis_server_plugin` mechanism in analysis_options.yaml
  # (top-level `plugins:` block) — the analyzer downloads it directly.
  # No custom_lint host involved → bypasses the synthesizer bug entirely.

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Italic-VariableFont_SOFT,WONK,opsz,wght.ttf
          style: italic
        - asset: assets/fonts/Fraunces-VariableFont_SOFT,WONK,opsz,wght.ttf

    - family: GeneralSans
      fonts:
        - asset: assets/fonts/GeneralSans-Variable.ttf
        - asset: assets/fonts/GeneralSans-VariableItalic.ttf
          style: italic
