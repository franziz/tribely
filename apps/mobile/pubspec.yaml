name: tribely
description: Tribely mobile app.
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ^3.11.0
  flutter: 3.41.9

dependencies:
  dio: ^5.9.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^9.2.4
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  get_it: ^8.3.0
  go_router: ^16.3.0
  intl: ^0.20.2
  json_annotation: ^4.11.0
  logger: ^2.7.0
  pretty_dio_logger: ^1.4.0
  # Per riverpod.dev official setup: riverpod 3.x ecosystem uses
  # annotation 4.x + generator 4.x (intentional split major).
  riverpod_annotation: ^4.0.2
  shared_preferences: ^2.5.3

dev_dependencies:
  build_runner: ^2.4.13
  custom_lint: ^0.8.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.13.2
  mocktail: ^1.0.5
  # Per riverpod.dev: generator 4.x is the companion to annotation 4.x.
  riverpod_generator: ^4.0.3
  # riverpod_lint 3.x targets the riverpod 3.x runtime + annotation 4.x.
  # Earlier failures stemmed from a version-track mismatch (annotation 3.x
  # but lint expecting annotation 4.x). The combo above is the documented
  # supported set.
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Italic-VariableFont_SOFT,WONK,opsz,wght.ttf
          style: italic
        - asset: assets/fonts/Fraunces-VariableFont_SOFT,WONK,opsz,wght.ttf

    - family: GeneralSans
      fonts:
        - asset: assets/fonts/GeneralSans-Variable.ttf
        - asset: assets/fonts/GeneralSans-VariableItalic.ttf
          style: italic
