name: tribely
description: Tribely mobile app.
publish_to: "none"
version: 0.0.1+1
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: 3.41.9

dependencies:
  dio: ^5.9.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.2
  flutter_secure_storage: ^9.2.4
  fpdart: ^1.1.1
  freezed_annotation: ^3.0.0
  get_it: ^8.2.0
  go_router: ^16.2.4
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.6.1
  pretty_dio_logger: ^1.4.0
  riverpod_annotation: ^3.0.2
  shared_preferences: ^2.5.3

dev_dependencies:
  build_runner: ^2.4.13
  custom_lint: ^0.8.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  mocktail: ^1.0.4
  riverpod_generator: ^3.0.2
  riverpod_lint: ^3.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Italic-VariableFont_SOFT,WONK,opsz,wght.ttf
          style: italic
        - asset: assets/fonts/Fraunces-VariableFont_SOFT,WONK,opsz,wght.ttf

    - family: GeneralSans
      fonts:
        - asset: assets/fonts/GeneralSans-Variable.ttf
        - asset: assets/fonts/GeneralSans-VariableItalic.ttf
          style: italic
