name: tribely
description: Tribely mobile app.
publish_to: "none"
version: 0.0.1+1
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.2
  riverpod_annotation: ^3.0.2

  # Routing
  go_router: ^16.2.4

  # DI
  get_it: ^8.2.0

  # Networking
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Functional / Result types
  fpdart: ^1.1.1

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  equatable: ^2.0.7

  # Logging
  logger: ^2.6.1

  # Utilities
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.4.13
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  riverpod_generator: ^3.0.2
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.2

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Italic-VariableFont_SOFT,WONK,opsz,wght.ttf
          style: italic
        - asset: assets/fonts/Fraunces-VariableFont_SOFT,WONK,opsz,wght.ttf

    - family: GeneralSans
      fonts:
        - asset: assets/fonts/GeneralSans-Variable.ttf
        - asset: assets/fonts/GeneralSans-VariableItalic.ttf
          style: italic
