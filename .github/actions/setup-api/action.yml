name: Setup API
description: Install Node (from .nvmrc), restore npm cache, install deps, generate Prisma client.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Generate Prisma client
      shell: bash
      run: npm run api:db:generate
