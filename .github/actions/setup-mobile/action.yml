name: Setup Mobile
description: Install Flutter, activate Melos, fetch pub deps, and run build_runner codegen.

inputs:
  flutter-version:
    description: Exact Flutter SDK version to install.
    required: false
    default: '3.27.4'
  flutter-channel:
    description: Flutter release channel.
    required: false
    default: stable
  melos-version:
    description: Exact Melos version to activate.
    required: false
    default: '7.5.0'

runs:
  using: composite
  steps:
    - name: Setup Flutter
      uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
      with:
        channel: ${{ inputs.flutter-channel }}
        flutter-version: ${{ inputs.flutter-version }}
        cache: true
        pub-cache: true

    - name: Activate Melos
      shell: bash
      run: dart pub global activate melos ${{ inputs.melos-version }}

    - name: Pub get (workspace)
      shell: bash
      run: dart pub get

    - name: Build runner (codegen)
      shell: bash
      run: melos run build_runner
