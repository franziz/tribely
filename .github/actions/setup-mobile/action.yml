name: Setup Mobile
description: Install Flutter (version from apps/mobile/pubspec.yaml), activate Melos, fetch pub deps, and run build_runner codegen.

inputs:
  flutter-channel:
    description: Flutter release channel.
    required: false
    default: stable
  melos-version:
    description: Exact Melos version to activate (must match pubspec dev_dependency).
    required: false
    default: '7.5.0'

runs:
  using: composite
  steps:
    - name: Setup Flutter
      uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
      with:
        channel: ${{ inputs.flutter-channel }}
        # SOT: apps/mobile/pubspec.yaml `environment.flutter`. Bumping Flutter is
        # one file edit, not three.
        flutter-version-file: apps/mobile/pubspec.yaml
        cache: true

    - name: Activate Melos
      shell: bash
      run: dart pub global activate melos ${{ inputs.melos-version }}

    - name: Pub get (workspace)
      shell: bash
      run: dart pub get

    # Pub Workspaces put package_config.json at the workspace root only.
    # custom_lint's analyzer plugin runs from `apps/mobile/.dart_tool/` and
    # doesn't walk up — without a per-member package_config, it fails to
    # resolve transitive deps like `custom_lint_builder`. Running
    # `flutter pub get` from the member directory creates the stub
    # package_config inside `apps/mobile/.dart_tool/`.
    - name: Pub get (mobile package)
      shell: bash
      working-directory: apps/mobile
      run: flutter pub get

    - name: Build runner (codegen)
      shell: bash
      run: melos run build_runner
