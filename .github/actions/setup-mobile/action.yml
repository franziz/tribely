name: Setup Mobile
description: Install Flutter (version from apps/mobile/pubspec.yaml), activate Melos, fetch pub deps, and run build_runner codegen.

inputs:
  flutter-channel:
    description: Flutter release channel.
    required: false
    default: stable
  melos-version:
    description: Exact Melos version to activate (must match pubspec dev_dependency).
    required: false
    default: '7.5.0'

runs:
  using: composite
  steps:
    - name: Setup Flutter
      uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
      with:
        channel: ${{ inputs.flutter-channel }}
        # SOT: apps/mobile/pubspec.yaml `environment.flutter`. Bumping Flutter is
        # one file edit, not three.
        flutter-version-file: apps/mobile/pubspec.yaml
        cache: true
        # Force-invalidate the pub-cache: subosito's restore can leave it in
        # a partial state where pub get reports "Got dependencies" but the
        # actual lib files (e.g. riverpod_lint-3.1.3/lib/riverpod_lint.dart)
        # are missing. Bumping the version suffix on this key (v2 → v3 → ...)
        # busts all old caches and forces a fresh pub get.
        pub-cache-key: "flutter-pub-v2-:os:-:channel:-:version:-:arch:-:hash:"

    - name: Activate Melos
      shell: bash
      run: dart pub global activate melos ${{ inputs.melos-version }}

    - name: Pub get (workspace)
      shell: bash
      run: dart pub get

    # Pub Workspaces resolve at the root, but custom_lint's analyzer plugin
    # runs from apps/mobile/.dart_tool/ — running flutter pub get from the
    # member directory ensures the per-member package_config stub exists so
    # the plugin can find transitive deps like custom_lint_builder.
    - name: Pub get (mobile package)
      shell: bash
      working-directory: apps/mobile
      run: flutter pub get

    - name: Build runner (codegen)
      shell: bash
      run: melos run build_runner
