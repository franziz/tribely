name: CLI checks

on:
  workflow_call:

# Default-deny at workflow level so this reusable workflow is self-defending
# regardless of caller. The job below grants only what it needs.
permissions: {}

jobs:
  cli:
    name: CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup CLI
        uses: ./.github/actions/setup-cli

      - name: Typecheck
        run: npm run cli:typecheck

      - name: Lint
        run: npm run cli:lint

      - name: Format check
        run: npm run --workspace=@tribely/cli format:check

      - name: Test
        run: npm run cli:test
