name: CI

on:
  pull_request:
  push:
    branches: [main]

# Default-deny: each job grants only the permissions it needs.
permissions: {}

# Cancel superseded runs on the same ref (e.g. force-push to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
      contents: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
      docker: ${{ steps.filter.outputs.docker }}
      neon-branch: ${{ steps.filter.outputs.neon-branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - '.nvmrc'
              - '.prettierignore'
              - '.github/actions/setup-api/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_api.yml'
            docker:
              - 'apps/api/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_docker-build.yml'
            mobile:
              - 'apps/mobile/**'
              - '.github/actions/setup-mobile/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_mobile.yml'
            neon-branch:
              - 'apps/api/prisma/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_neon-branch.yml'
              - '.github/actions/setup-api/**'

  api:
    name: API
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_api.yml
    permissions:
      contents: read

  mobile:
    name: Mobile
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_mobile.yml
    permissions:
      contents: read

  docker:
    name: Docker build
    needs: detect-changes
    if: needs.detect-changes.outputs.docker == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_docker-build.yml
    permissions:
      contents: read

  neon-branch:
    name: Neon migration check
    needs: detect-changes
    if: github.event_name == 'pull_request' && (needs.detect-changes.outputs.neon-branch == 'true' || github.event.action == 'closed')
    uses: ./.github/workflows/_neon-branch.yml
    secrets: inherit
    permissions:
      contents: read

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      - name: Lint PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            build
            ci
            perf
            style
            revert
          requireScope: false
          subjectPattern: ^[A-Za-z].+$
          subjectPatternError: |
            The PR subject (after the type/scope) must start with a letter and not be empty.

  # Aggregate gate. Required-check on `main` is just this single job;
  # path-filtered skips don't break protection rules.
  ci-passed:
    name: CI passed
    if: always()
    needs: [detect-changes, api, mobile, docker, neon-branch, pr-title]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Verify upstream jobs
        run: |
          set -euo pipefail
          declare -A results=(
            [detect-changes]="${{ needs.detect-changes.result }}"
            [api]="${{ needs.api.result }}"
            [mobile]="${{ needs.mobile.result }}"
            [docker]="${{ needs.docker.result }}"
            [neon-branch]="${{ needs.neon-branch.result }}"
            [pr-title]="${{ needs.pr-title.result }}"
          )
          fail=0
          for job in "${!results[@]}"; do
            r="${results[$job]}"
            echo "$job: $r"
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::Upstream job '$job' result was '$r'"
              fail=1
            fi
          done
          exit $fail
