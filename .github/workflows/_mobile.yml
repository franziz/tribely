name: Mobile checks

on:
  workflow_call:

# Default-deny at workflow level so this reusable workflow is self-defending
# regardless of caller. The job below grants only what it needs.
permissions: {}

jobs:
  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Setup Mobile
        uses: ./.github/actions/setup-mobile

      - name: Format check
        working-directory: apps/mobile
        run: dart format --set-exit-if-changed --output none .

      # Per invertase/dart_custom_lint docs: in CI, use the two documented
      # commands separately rather than `flutter analyze` which tries to
      # load custom_lint as an analyzer plugin. The plugin host is fragile
      # in fresh CI environments (it auto-generates lib/custom_lint_client.dart
      # with stale package version refs and fails to start). The plugin block
      # in analysis_options.yaml stays — that's for IDE live diagnostics.
      - name: Analyze (core analyzer rules)
        working-directory: apps/mobile
        run: dart analyze --fatal-infos

      - name: Lint (custom_lint rules — riverpod_lint, etc.)
        working-directory: apps/mobile
        run: dart run custom_lint

      - name: Test (with coverage)
        working-directory: apps/mobile
        run: flutter test --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/
          retention-days: 14
          if-no-files-found: ignore
