name: Mobile checks

on:
  workflow_call:

# Default-deny at workflow level so this reusable workflow is self-defending
# regardless of caller. The job below grants only what it needs.
permissions: {}

jobs:
  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Mobile
        uses: ./.github/actions/setup-mobile

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Format check
        run: npm run mobile:format:check

      # `flutter analyze` loads riverpod_lint via the analysis_server_plugin
      # mechanism (top-level `plugins:` in analysis_options.yaml). No
      # custom_lint host involved.
      - name: Analyze
        run: npm run mobile:analyze

      - name: Test (with coverage)
        run: npm run mobile:test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/
          retention-days: 14
          if-no-files-found: ignore
