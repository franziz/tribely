name: API checks

on:
  workflow_call:

# Default-deny at workflow level so this reusable workflow is self-defending
# regardless of caller. The job below grants only what it needs.
permissions: {}

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    # Postgres service container — integration tests under
    # `*.integration.test.ts` connect to this DB. The service spins up
    # alongside the job and is identical wire-protocol to Neon, so the
    # `@prisma/adapter-pg` runtime client doesn't care which backend it
    # hits. Neon ephemeral branches (TRI-2) are for a different question
    # — migration verification on production-shaped data — and are not
    # provisioned here.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tribely_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tribely_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Real wire-up to the Postgres service container above. format / type /
    # lint steps don't consume DB but the var is harmless when set. Step-
    # level env still overrides for setup-api's prisma-generate placeholder.
    # DATABASE_URL points at the runtime role (tribely_app) — tests run with
    # restricted privileges. ADMIN_DATABASE_URL (superuser) is used only by
    # the migrate and bootstrap steps via step-level env overrides.
    env:
      DATABASE_URL: postgresql://tribely_app:ci_runtime_pw@localhost:5432/tribely_test?schema=public
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tribely_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup API
        uses: ./.github/actions/setup-api

      - name: Apply migrations
        # prisma migrate deploy reads DATABASE_URL; override to superuser so
        # DDL (CREATE TABLE, ALTER TABLE, etc.) succeeds. The job-level
        # DATABASE_URL (runtime role) intentionally lacks DDL privileges.
        env:
          DATABASE_URL: ${{ env.ADMIN_DATABASE_URL }}
        run: npm run --workspace=@tribely/api db:migrate:deploy

      - name: Bootstrap runtime role
        # Creates the tribely_app role and grants row-level privileges on all
        # migrated tables. Must run after migrate (tables must exist) and
        # before tests (tests connect as tribely_app via job-level DATABASE_URL).
        env:
          ADMIN_DATABASE_URL: ${{ env.ADMIN_DATABASE_URL }}
          RUNTIME_DB_PASSWORD: ci_runtime_pw
        run: npm run --workspace=@tribely/api db:roles:bootstrap

      - name: Format check
        run: npm run --workspace=@tribely/api format:check

      - name: Typecheck
        run: npm run --workspace=@tribely/api typecheck

      - name: Lint
        run: npm run --workspace=@tribely/api lint

      - name: Test (with coverage)
        # env.ts parses process.env at module load and throws on missing
        # required vars — DATABASE_URL is set at the job level, JWT_SECRET
        # is set here (test-step-scoped is fine; not needed elsewhere).
        # Real secrets are not required, only values that pass the Zod
        # schema.
        env:
          NODE_ENV: test
          JWT_SECRET: ci-placeholder-secret-must-be-at-least-32-chars
          PHONE_HASH_SALT: test_phone_hash_salt_at_least_32_chars_long
        run: npm run --workspace=@tribely/api test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-coverage
          path: apps/api/coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Audit dependencies (warn-only)
        run: npm audit --audit-level=high
        continue-on-error: true
