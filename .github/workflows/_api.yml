name: API checks

on:
  workflow_call:

# Default-deny at workflow level so this reusable workflow is self-defending
# regardless of caller. The job below grants only what it needs.
permissions: {}

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Setup API
        uses: ./.github/actions/setup-api

      - name: Format check
        run: npm run --workspace=@tribely/api format:check

      - name: Typecheck
        run: npm run --workspace=@tribely/api typecheck

      - name: Lint
        run: npm run --workspace=@tribely/api lint

      - name: Test (with coverage)
        # env.ts parses process.env at module load and throws on missing
        # required vars. Tests don't hit the DB, but importing anything
        # that transitively loads env (e.g., the logger) needs these set.
        # Real secrets are not needed — placeholders that satisfy the Zod
        # schema are enough.
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/tribely_test?schema=public
          JWT_SECRET: ci-placeholder-secret-must-be-at-least-32-chars
        run: npm run --workspace=@tribely/api test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-coverage
          path: apps/api/coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Audit dependencies (warn-only)
        run: npm audit --audit-level=high
        continue-on-error: true
